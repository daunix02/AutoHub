<!DOCTYPE html>

<html>
<body>
<head>
  <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>

<h1>Power Pistons Auto Hub</h1>

<p>One stop solution for all things for Automotive related things</p>

<main>
    <h2>Available Cars</h2>

    <div class="car-container">

        {% for car in cars %}

        <div class="car-card">

            <img src="{{ url_for('static', filename='images/' + car[3]) }}">

            <h3>{{ car[0] }}</h3>
            <p>Year: {{ car[1] }}</p>
            <p>Price: {{ car[2] }}</p>

        </div>

        {% endfor %}

    </div>
</main>
<nav>links</nav>
</body>
</html>
